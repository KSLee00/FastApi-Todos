# 프로젝트 식별자 (SonarQube에서 프로젝트를 구분하는 고유 키)
sonar.projectKey=fastapi_app
# SonarQube 대시보드에 표시될 프로젝트 이름
sonar.projectName=FastAPI App
# 프로젝트 버전 정보 (선택사항, 릴리즈 관리 시 유용)
sonar.projectVersion=5.0.0

# 분석할 소스 코드 경로 (현재 디렉토리 기준 전체) — 테스트는 sonar.tests 로 따로 잡는다
sonar.sources=.
sonar.tests=tests
# Dockerfile 의 파이썬 버전 (지정하지 않으면 분석할 때마다 경고)
sonar.python.version=3.13

# SonarQube 서버 URL (Jenkins에서 실행할 때는 withSonarQubeEnv가 6번에서 등록한 URL로 덮어씀)
sonar.host.url=http://localhost:9000
# 토큰(sonar.token)은 이 파일에 절대 적지 않음 - GitHub에 올라가면 그대로 유출됨 (Jenkins Credentials로만 관리)

# 테스트 커버리지 리포트 경로 — 스캐너보다 먼저 fastapi-app 에서 실행: pytest tests --cov=main --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml

# 분석에서 제외할 파일 패턴
# - JS, CSS, HTML은 백엔드 분석 대상이 아니므로 제외
# - coverage.xml은 소스가 아니라 테스트 결과물이므로 제외
# - tests/ 는 sonar.tests 로 분석하므로 소스에서는 제외 (같은 파일을 두 번 잡으면 스캐너가 실패한다)
sonar.exclusions=tests/**,**/*.js,**/*.css,**/*.html,**/coverage.xml