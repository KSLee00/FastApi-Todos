services:
  fastapi-app:
    build:
      context: ./fastapi-app      # Dockerfile이 위치한 디렉토리 경로
      dockerfile: Dockerfile      # Dockerfile 이름 (생략 가능, 기본값은 'Dockerfile')
    container_name: FastApi-app
    ports:
      - "8032:8000"
    restart: unless-stopped       # 서버 재부팅·오류 시 자동 재시작
    environment:
      - APP_TZ=Asia/Seoul         # 반복 할 일·통계의 "오늘" 기준 (UTC 를 쓰면 오전 9시에 날짜가 바뀜)
      - LEGACY_OWNER=${LEGACY_OWNER:-}   # v5 까지의 할 일을 가져갈 아이디 (비우면 아무도 안 가져감)
      - COOKIE_SECURE=${COOKIE_SECURE:-0} # HTTPS 로 서비스할 때만 1
    volumes:
      - todo_data:/app/data       # SQLite DB — 컨테이너를 새로 만들어도(다시 배포해도) 데이터가 남는다
    security_opt:
      - no-new-privileges:true    # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                       # 불필요한 커널 권한 모두 제거
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (아래 볼륨과 /tmp만 쓰기 가능)
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:                                      # /tmp 만 쓰기 가능하게
      - /tmp

  prometheus:                                   # ← #7 추가: 메트릭 수집
    image: prom/prometheus:v3.15.0              # latest 대신 버전 고정
    container_name: prometheus
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (데이터 볼륨만 쓰기 가능)
    security_opt:
      - no-new-privileges:true                  # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                                     # 불필요한 커널 권한 모두 제거
    ports:
      - "127.0.0.1:7070:9090"                   # 서버 자신에게만 공개 (Prometheus는 로그인 기능이 없음)
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro   # 설정 파일은 읽기 전용(:ro)
      - prometheus-data:/prometheus             # 수집한 메트릭 저장 (컨테이너를 다시 만들어도 유지)

  grafana:                                      # ← #7 추가: 대시보드
    image: grafana/grafana:13.2.4               # latest 대신 버전 고정 (2026-10-13 보안 패치 버전)
    container_name: grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_BASIC_PASSWORD_POLICY=true      # 비밀번호 12자 이상 + 대·소문자·숫자·특수문자 필수
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
    volumes:
      - grafana-data:/var/lib/grafana

  node-exporter:                                # ← #7 추가: 서버 CPU·메모리·디스크·네트워크
    image: prom/node-exporter:v1.12.1           # latest 대신 버전 고정
    container_name: node-exporter
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ports 없음: Prometheus가 내부 네트워크(node-exporter:9100)로 수집하므로 외부 공개 불필요

  cadvisor:                                     # ← #7 추가: 컨테이너별 사용량 (과제 (4))
    image: ghcr.io/google/cadvisor:v0.60.6      # 버전 고정 — v0.53.0부터 이미지 위치가 ghcr.io 로 바뀜
    container_name: cadvisor
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - "--docker_only=true"                    # 도커 컨테이너만 수집 (시스템 서비스까지 모으면 메트릭이 너무 많아짐)
      - "--housekeeping_interval=15s"           # Prometheus 수집 주기와 맞춤 (기본 1초는 CPU를 많이 씀)
    devices:
      - /dev/kmsg                               # 컨테이너 OOM(메모리 부족 종료) 감지용
    volumes:                                    # 서버의 컨테이너 정보를 읽기만 한다 (모두 :ro)
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # ports 없음: 공식 예제의 8080:8080 은 Jenkins 포트와 겹치고, cAdvisor 화면에는 로그인 기능이 없음

  influxdb:                                     # ← #8 추가: JMeter 결과를 시간순으로 저장 → Grafana 에서 그래프로
    image: influxdb:1.11.8                      # JMeter 기본 Backend Listener 가 쓰는 1.x API — 1.x 최신 버전으로 고정
    container_name: influxdb
    restart: unless-stopped
    environment:
      - INFLUXDB_DB=jmeter                      # 처음 뜰 때 jmeter 데이터베이스를 만든다
      - INFLUXDB_REPORTING_DISABLED=true        # 사용 통계를 InfluxData 로 보내지 않는다
    ports:
      # 서버 자신에게만 공개 (InfluxDB 1.x 는 기본 설정에 로그인이 없다)
      # Jenkins 가 JMeter 를 호스트 네트워크로 돌리므로, 파이프라인의 부하 테스트 결과도 localhost:8086 으로 들어온다
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb         # 수집한 결과 저장 (컨테이너를 다시 만들어도 유지)
    security_opt:
      - no-new-privileges:true

  jmeter:                                       # ← #8 추가: 부하 테스트 (한 번 실행하고 끝나는 컨테이너)
    build:
      context: ./jmeter
      dockerfile: Dockerfile
    container_name: jmeter
    profiles: ["loadtest"]                      # docker compose up 때마다 부하 테스트가 돌지 않게 — 실행은 아래처럼 직접
    #   docker compose run --rm jmeter
    depends_on:
      - influxdb
    volumes:
      - ./jmeter:/jmeter:ro                     # 테스트 계획만 읽는다 (결과는 InfluxDB 로, HTML 리포트는 Jenkins 가 만든다)
    command:
      - jmeter
      - -n
      - -t
      - /jmeter/fastapi_test_plan.jmx
      - -l
      - /tmp/results.jtl                        # 컨테이너 안 임시 위치 — 서버 폴더 쓰기 권한 문제를 피한다
      - -j
      - /tmp/jmeter.log
      - -JTARGET_HOST=fastapi-app               # 같은 compose 안이라 서비스 이름과 컨테이너 내부 포트로 접속
      - -JTARGET_PORT=8000
      - -JINFLUX_URL=http://influxdb:8086/write?db=jmeter
      # 사용자 수 · 램프업(초) · 반복 횟수 — 실행할 때 바꿀 수 있다
      #   JM_THREADS=30 JM_RAMP=10 JM_LOOPS=10 docker compose run --rm jmeter
      # 램프업이 길면 앞사람이 끝난 뒤 다음 사람이 들어와 동시 사용자가 1명뿐이 된다 → 짧게 둔다
      - -JTHREADS=${JM_THREADS:-30}             # 사용자 30명이
      - -JRAMP=${JM_RAMP:-10}                   # 10초 안에 모두 들어와서
      - -JLOOPS=${JM_LOOPS:-10}                 # 각자 10번씩 (가입 → 할 일 추가 → 조회 → 달력 → 탈퇴)
    # networks 없음: 같은 compose 의 서비스는 기본 네트워크로 서로 통신한다
    # (정의하지 않은 loadtest-net 을 적으면 docker compose 명령 전체가 오류로 멈춘다)

volumes:
  todo_data:                                    # 앱 데이터 (SQLite)
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  prometheus-data:                              # ← #7 추가
  grafana-data:                                 # ← #7 추가
  influxdb-data:                                # ← #8 추가
