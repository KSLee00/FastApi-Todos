services:
  fastapi-app:
    build:
      context: ./fastapi-app      # Dockerfile이 위치한 디렉토리 경로
      dockerfile: Dockerfile      # Dockerfile 이름 (생략 가능, 기본값은 'Dockerfile')
    container_name: FastApi-app
    ports:
      - "8032:8000"
    restart: unless-stopped       # 서버 재부팅·오류 시 자동 재시작
    environment:
      - APP_TZ=Asia/Seoul         # 반복 할 일·통계의 "오늘" 기준 (UTC 를 쓰면 오전 9시에 날짜가 바뀜)
    volumes:
      - todo_data:/app/data       # SQLite DB — 컨테이너를 새로 만들어도(다시 배포해도) 데이터가 남는다
    security_opt:
      - no-new-privileges:true    # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                       # 불필요한 커널 권한 모두 제거
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (아래 볼륨과 /tmp만 쓰기 가능)
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:                                      # /tmp 만 쓰기 가능하게
      - /tmp

volumes:
  todo_data:                                    # 앱 데이터 (SQLite)
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
